name: CI

on:
  push:
    branches: [develop, main]
    paths-ignore:
      - 'docs/**'
      - '**.md'
  pull_request:
    branches: [develop, main]
    paths-ignore:
      - 'docs/**'
      - '**.md'

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: subosito/flutter-action@fd55f4c5af5b953cc57a2be44cb082c8f6635e8e # v2.21.0
        with:
          flutter-version: 3.47.7
          channel: stable
          cache: true
      # Every run re-downloaded the same system packages, which is minutes of
      # wall clock and a stalled-mirror risk on each push. The archives are
      # cached in a user-owned directory (apt's own is root-owned) and the
      # acquire timeouts cap a dead mirror instead of hanging the job.
      - name: Cache apt archives
        uses: actions/cache@d4323d4df104b026a6aa633fdb11d772146be0bf # v4.2.2
        with:
          path: ~/.cache/apt-archives
          key: apt-${{ runner.os }}-${{ hashFiles('.github/workflows/ci.yml') }}
          restore-keys: apt-${{ runner.os }}-
      # cnativeapi's native-assets hook compiles on the host during pub get;
      # its build.dart needs pkg-config plus the GTK 3, X11 and Xi headers.
      - name: Install native build dependencies
        run: |
          # apt refuses to run unless the archives directory exists with a
          # partial/ child; a cold cache restores neither.
          mkdir -p "$HOME/.cache/apt-archives/partial"
          APT="sudo apt-get -o Acquire::Retries=5
            -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30
            -o Dir::Cache::archives=$HOME/.cache/apt-archives"
          $APT update
          $APT install -y clang cmake ninja-build pkg-config \
            libgtk-3-dev libx11-dev libxi-dev
      - name: Resolve dependencies
        run: flutter pub get
      - name: Generate localizations
        run: flutter gen-l10n
      - name: Generate sources
        run: dart run build_runner build
      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test
      - name: Analyze
        run: flutter analyze
      - name: Test
        run: flutter test
      - name: Verify Drift web assets
        run: |
          test -f web/sqlite3.wasm
          test -f web/drift_worker.js
      # PWA offline caching is provided by web/nyachi_service_worker.js via
      # the custom web/flutter_bootstrap.js; Flutter's uninstaller stub is
      # emitted as a dead file and never registered.
      - name: Build web
        run: flutter build web --release
      # The release ships a WebAssembly build alongside the JS one; compile it
      # here so a wasm-incompatible dependency fails CI, not a release.
      - name: Build web (WebAssembly)
        run: flutter build web --release --wasm -o build/web-wasm

  android-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: subosito/flutter-action@fd55f4c5af5b953cc57a2be44cb082c8f6635e8e # v2.21.0
        with:
          flutter-version: 3.47.7
          channel: stable
          cache: true
      - name: Cache Gradle
        uses: actions/cache@d4323d4df104b026a6aa633fdb11d772146be0bf # v4.2.2
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties', 'pubspec.lock') }}
          restore-keys: gradle-${{ runner.os }}-
      - name: Resolve dependencies
        run: flutter pub get
      - name: Generate localizations
        run: flutter gen-l10n
      - name: Generate sources
        run: dart run build_runner build
      - name: Build Android APK
        run: flutter build apk --debug

  macos-build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: subosito/flutter-action@fd55f4c5af5b953cc57a2be44cb082c8f6635e8e # v2.21.0
        with:
          flutter-version: 3.47.7
          channel: stable
          cache: true
      - name: Cache CocoaPods
        uses: actions/cache@d4323d4df104b026a6aa633fdb11d772146be0bf # v4.2.2
        with:
          path: ~/Library/Caches/CocoaPods
          key: pods-${{ runner.os }}-${{ hashFiles('macos/Podfile.lock') }}
          restore-keys: pods-${{ runner.os }}-
      # SPM wraps podspec plugins with the plugin's own platform floor
      # (flutter_inappwebview_macos declares 10.14 while its code needs
      # 10.15+), so build through CocoaPods, which follows the project's
      # 12.0 deployment target.
      - name: Prefer CocoaPods over Swift Package Manager
        run: flutter config --no-enable-swift-package-manager
      - name: Resolve dependencies
        run: flutter pub get
      - name: Generate localizations
        run: flutter gen-l10n
      - name: Generate sources
        run: dart run build_runner build
      # `flutter build macos` has no --no-codesign flag (that is `build ios`).
      # Without a signing identity the tool falls back to an unsigned build,
      # which is all this sanity job needs.
      - name: Build macOS app
        run: flutter build macos --debug

name: Prerelease

# Publishes a pre-release from a version tag (e.g. v2.0.0-beta.1).
# Artifacts: signed APK, AAB and the web bundle.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to publish (e.g. v2.0.0-beta.1)'
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@fd55f4c5af5b953cc57a2be44cb082c8f6635e8e # v2.21.0
        with:
          flutter-version: 3.47.7
          channel: stable
          cache: true

      - name: Resolve version
        id: version
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          # Strip the leading "v"; the tag names the release, pubspec drives
          # the build's own version metadata.
          echo "name=${TAG#v}" >> "$GITHUB_OUTPUT"

      - run: flutter pub get
      - run: flutter gen-l10n
      - run: dart run build_runner build

      - name: Restore keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 secret is not configured"
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/nyachi-release.jks"
          cat > android/key.properties <<EOF
          storeFile=$RUNNER_TEMP/nyachi-release.jks
          storePassword=${{ secrets.ANDROID_STORE_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          EOF

      - run: flutter build apk --release
      - run: flutter build appbundle --release
      - run: flutter build web --release

      - name: Collect artifacts
        run: |
          V="${{ steps.version.outputs.name }}"
          mkdir -p out
          cp build/app/outputs/flutter-apk/app-release.apk "out/nyachi-$V.apk"
          cp build/app/outputs/bundle/release/app-release.aab "out/nyachi-$V.aab"
          (cd build/web && zip -qr "../../out/nyachi-$V-web.zip" .)
          ls -lh out

      - uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: nyachi-prerelease
          path: out/*

      - name: Publish pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.version.outputs.tag }}" \
            --title "Nyachi ${{ steps.version.outputs.name }}" \
            --prerelease \
            --generate-notes \
            out/*
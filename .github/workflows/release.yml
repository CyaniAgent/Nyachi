name: Release

# Builds and publishes a version tag (e.g. v2.0.0-beta.5).
# Artifacts: split-per-ABI APKs, AAB, and Windows/macOS/Linux bundles.
#
# Release semantics come from the tag itself:
#   - v2.0.0-beta.* / v2.0.0-rc.*  → marked as a pre-release
#   - anything else (v2.0.0)       → a stable release
#
# Releases are infrequent by policy: only cut one when the maintainer asks.
# To cut one, run the "Cut release" workflow with the new version number; it
# bumps pubspec.yaml, commits, tags, and dispatches this workflow.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to publish (e.g. v2.0.0-beta.5)'
        required: true
      dry_run:
        description: 'Build only; do not create the release'
        required: false
        default: 'false'
        type: choice
        options: ['true', 'false']

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@fd55f4c5af5b953cc57a2be44cb082c8f6635e8e # v2.21.0
        with:
          flutter-version: 3.47.7
          channel: stable
          cache: true

      - name: Resolve version
        id: version
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "name=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Cache Gradle
        uses: actions/cache@d4323d4df104b026a6aa633fdb11d772146be0bf # v4.2.2
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties', 'pubspec.lock') }}
          restore-keys: gradle-${{ runner.os }}-

      - run: flutter pub get
      - run: flutter gen-l10n
      - run: dart run build_runner build

      - name: Restore keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 secret is not configured"
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/nyachi-release.jks"
          # Group redirection instead of a heredoc: an indented EOF inside a
          # YAML block scalar never terminates the heredoc.
          {
            echo "storeFile=$RUNNER_TEMP/nyachi-release.jks"
            echo "storePassword=${{ secrets.ANDROID_STORE_PASSWORD }}"
            echo "keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}"
            echo "keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}"
          } > android/key.properties

      # Per-ABI APKs keep each download at a fraction of the fat APK size;
      # the AAB stays the Play Store upload format.
      - run: flutter build apk --release --split-per-abi
      - run: flutter build appbundle --release

      - name: Collect artifacts
        run: |
          V="${{ steps.version.outputs.name }}"
          mkdir -p out
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk "out/nyachi-$V-android-armeabi-v7a.apk"
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk "out/nyachi-$V-android-arm64-v8a.apk"
          cp build/app/outputs/flutter-apk/app-x86_64-release.apk "out/nyachi-$V-android-x86_64.apk"
          cp build/app/outputs/bundle/release/app-release.aab "out/nyachi-$V-android.aab"
          ls -lh out

      - uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: android
          path: out/*

  desktop:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Pin the oldest supported LTS for Linux release binaries: glibc
          # built on a newer release refuses to start on older ones.
          - os: ubuntu-24.04
            target: linux-x64
          - os: ubuntu-latest
            target: web
          # Same app, compiled to WebAssembly with a JS fallback for browsers
          # that cannot run it.
          - os: ubuntu-latest
            target: web-wasm
          - os: windows-latest
            target: windows-x64
          - os: macos-latest
            target: macos-arm64
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: subosito/flutter-action@fd55f4c5af5b953cc57a2be44cb082c8f6635e8e # v2.21.0
        with:
          flutter-version: 3.47.7
          channel: stable
          cache: true

      - name: Resolve version
        id: version
        shell: bash
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          echo "name=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Install Linux build dependencies
        if: matrix.target == 'linux-x64'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libsecret-1-dev libjsoncpp-dev \
            libmpv-dev mpv

      - name: Cache CocoaPods
        if: matrix.target == 'macos-arm64'
        uses: actions/cache@d4323d4df104b026a6aa633fdb11d772146be0bf # v4.2.2
        with:
          path: ~/Library/Caches/CocoaPods
          key: pods-${{ runner.os }}-${{ hashFiles('macos/Podfile.lock') }}
          restore-keys: pods-${{ runner.os }}-

      # Same rationale as ci.yml: SPM builds podspec plugins with the
      # plugin's 10.14 platform floor and breaks on 10.15+ APIs.
      - run: flutter config --no-enable-swift-package-manager
        if: matrix.target == 'macos-arm64'
      - run: flutter pub get
      - run: flutter gen-l10n
      - run: dart run build_runner build
      - name: Build
        shell: bash
        run: |
          case "${{ matrix.target }}" in
            linux-x64) flutter build linux --release ;;
            windows-x64) flutter build windows --release ;;
            macos-arm64) flutter build macos --release ;;
            web) flutter build web --release ;;
            web-wasm) flutter build web --release --wasm ;;
          esac

      - name: Collect artifacts
        shell: bash
        run: |
          V="${{ steps.version.outputs.name }}"
          T="${{ matrix.target }}"
          export V T
          mkdir -p out
          case "$T" in
            linux-x64)
              (cd build/linux/x64/release/bundle && zip -qr "$GITHUB_WORKSPACE/out/nyachi-$V-$T.zip" .)
              ;;
            windows-x64)
              # Compress-Archive runs inside a bash-quoted string, so the
              # PowerShell $env: form never reaches it; expand bash vars here.
              powershell -NoProfile -Command "Compress-Archive -Path 'build/windows/x64/runner/Release/*' -DestinationPath 'out/nyachi-$V-$T.zip' -Force"
              ;;
            macos-arm64)
              (cd build/macos/Build/Products/Release && zip -qry "$GITHUB_WORKSPACE/out/nyachi-$V-$T.zip" *.app)
              ;;
            web|web-wasm)
              (cd build/web && zip -qr "$GITHUB_WORKSPACE/out/nyachi-$V-$T.zip" .)
              ;;
          esac
          ls -lh out

      - uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: desktop-${{ matrix.target }}
          path: out/*

  release:
    runs-on: ubuntu-latest
    needs: [android, desktop]
    # Rehearsal mode (workflow_dispatch with dry_run=true) builds every
    # artifact but stops short of publishing.
    if: github.event_name == 'push' || inputs.dry_run != 'true'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Verify tag matches pubspec version
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          PUBSPEC="v$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d+ -f1)"
          if [ "$TAG" != "$PUBSPEC" ]; then
            echo "::error::tag $TAG does not match pubspec version $PUBSPEC"
            exit 1
          fi

      - name: Verify stable tags live on main
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          case "$TAG" in
            *-beta*|*-rc*)
              # Pre-releases are cut from the develop integration line while
              # main is still the legacy 1.3.4 history.
              exit 0
              ;;
          esac
          git fetch origin main --depth=250
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::stable tag $TAG must point to a commit on main"
            echo "::error::flow: develop -> release/* -> main, then tag on main"
            exit 1
          fi

      - uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          path: out
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          ls -lh out
          # beta/rc tags publish as pre-releases; anything else is stable.
          FLAGS=(--title "Nyachi ${TAG#v}" --generate-notes out/*)
          if [[ "$TAG" == *-beta* || "$TAG" == *-rc* ]]; then
            FLAGS+=(--prerelease)
          fi
          gh release create -R CyaniAgent/Nyachi "$TAG" "${FLAGS[@]}"

org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false

# flutter_inappwebview_android 1.1.3 (the stable line the app pins) calls
# getDefaultProguardFile('proguard-android.txt'), which AGP 9 rejects by
# default. The check is SoftlyEnforced until AGP 10.0, so it can be turned
# off here; drop this line once flutter_inappwebview ships a stable release
# that uses proguard-android-optimize.txt.
android.r8.proguardAndroidTxt.disallowed=false

name: nyachi
description: "A Misskey client."
publish_to: 'none'
repository: https://github.com/CyaniAgent/Nyachi
issue_tracker: https://github.com/CyaniAgent/Nyachi/issues
version: 2.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cached_network_image: ^4.0.5
  drift: ^2.35.2
  drift_flutter: ^0.3.1
  dio: ^5.9.0
  file_picker: ^13.1.0
  flutter_riverpod: ^3.4.3
  flutter_secure_storage: ^11.2.0
  freezed_annotation: ^3.1.0
  go_router: ^18.1.1
  intl: ^0.20.2
  json_annotation: ^4.12.0
  media_kit: ^1.2.6
  media_kit_libs_video: ^1.0.7
  media_kit_video: ^2.0.1
  misskey_dart_api: ^0.1.0
  path_provider: ^2.1.5
  riverpod_annotation: ^4.0.7
  shared_preferences: ^2.5.6
  url_launcher: ^6.3.3
  uuid: ^4.6.0
  web: ^1.1.1

dev_dependencies:
  build_runner: ^2.16.2
  dart_pubspec_licenses: ^3.0.12
  drift_dev: ^2.35.1
  fake_async: ^1.3.1
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  freezed: ^4.0.3
  go_router_builder: ^4.5.2
  json_serializable: ^6.15.2
  mocktail: ^1.0.4
  riverpod_generator: ^4.0.9
  riverpod_lint: ^3.1.9

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/licenses.json

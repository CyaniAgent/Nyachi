<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A Misskey client.">
  <meta name="theme-color" content="#EADDFF">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Nyachi">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Nyachi</title>
  <link rel="manifest" href="manifest.json">
  <script>
    // PWA offline support; see web/nyachi_service_worker.js. The custom
    // web/flutter_bootstrap.js keeps Flutter's uninstaller stub
    // unregistered.
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('nyachi_service_worker.js');
      });
    }
  </script>
  <style>
    /* Splash shown until Flutter paints its first frame. flutter_bootstrap.js
       removes #nyachi-splash; the fallback timer there guarantees it fades
       even if the Flutter loader never starts, so it cannot trap the page. */
    html, body {
      margin: 0;
      height: 100%;
      background: #FEF7FF;
    }
    #nyachi-splash {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 24px;
      background: inherit;
      z-index: 2147483647;
      transition: opacity 220ms ease-out;
    }
    #nyachi-splash.nyachi-splash-hidden {
      opacity: 0;
      pointer-events: none;
    }
    #nyachi-splash img {
      width: 96px;
      height: 96px;
      border-radius: 24px;
      animation: nyachi-breathe 1400ms ease-in-out infinite;
    }
    #nyachi-splash span {
      font: 600 20px/1 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
        sans-serif;
      letter-spacing: 0.04em;
      color: #68548E;
    }
    @keyframes nyachi-breathe {
      0%, 100% { transform: scale(0.96); opacity: 0.85; }
      50% { transform: scale(1.04); opacity: 1; }
    }
    /* Match the app's dark surface instead of flashing a white page. */
    @media (prefers-color-scheme: dark) {
      html, body { background: #141218; }
      #nyachi-splash span { color: #D0BCFF; }
    }
    /* Honour a system request for less motion. */
    @media (prefers-reduced-motion: reduce) {
      #nyachi-splash img { animation: none; }
    }
  </style>
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <div id="nyachi-splash">
    <img src="icons/Icon-192.png" alt="">
    <span>Nyachi</span>
  </div>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
